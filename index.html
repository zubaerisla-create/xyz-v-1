<!DOCTYPE html>
<html lang="en" id="html" data-theme="light" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <link rel="shortcut icon" href="./logo.jpg" type="image/x-icon" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Abdullah Al Zubaer Mern Stack Developer portfolio website showcasing projects and skills" />
    <meta name="keywords" content="Abdullah Al Zubaer Mern Stack Developer , portfolio, web development, Abdullah Al Zubaer" />
    <meta name="author" content="Abdullah Al Zubaer" />
    <title>Abdullah Al Zubaer Mern Stack Developer Portfolio</title>
    
    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:title" content="Abdullah Al Zubaer Mern Stack Developer | Portfolio" />
    <meta property="og:description" content="Professional portfolio showcasing my projects and skills" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://yourwebsite.com" />
    <meta property="og:image" content="/preview-image.jpg" />
    
    <!-- Preconnect to external domains for performance -->
    <link rel="dns-prefetch" href="https://i.ibb.co">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  </head>
  <body>
    <div id="root">
      <!-- Instant splash shown before React JS loads -->
      <div id="app-splash" style="
        position:fixed;inset:0;z-index:9999;
        background:#f5f4f0;
        display:flex;flex-direction:column;
        align-items:center;justify-content:center;
        font-family:sans-serif;
        transition:opacity .5s ease;
      ">
        <div style="position:relative;width:96px;height:96px;display:flex;align-items:center;justify-content:center;margin-bottom:20px;">
          <!-- Rotating outer gradient ring -->
          <div style="
            position:absolute;inset:0;border-radius:50%;
            background:conic-gradient(#38bdf8,#6366f1,#a855f7,#38bdf8);
            animation:spl-spin 1.6s linear infinite;
          "></div>
          <!-- Static inner logo (does not rotate) -->
          <div style="
            position:relative;z-index:2;width:84px;height:84px;border-radius:50%;
            background:#f5f4f0;
            display:flex;align-items:center;justify-content:center;
            overflow:hidden;padding:3px;
          ">
            <img src="./logo.jpg" alt="Logo" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" />
          </div>
        </div>
        <h1 style="margin:0 0 4px;font-size:18px;font-weight:700;color:#1e293b;letter-spacing:.5px;">Abdullah Al Zubaer</h1>
        <p style="margin:0 0 20px;font-size:11px;color:#94a3b8;letter-spacing:3px;text-transform:uppercase;">Full Stack Developer</p>
        <div style="width:180px;height:3px;border-radius:99px;background:#e2e8f0;overflow:hidden;">
          <div id="spl-bar" style="height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#38bdf8,#6366f1);transition:width .3s ease;"></div>
        </div>
        <style>
          @keyframes spl-spin{to{transform:rotate(360deg)}}
        </style>
        <script>
          var p=0;
          var iv=setInterval(function(){
            p+=Math.random()*20+12;
            var el=document.getElementById('spl-bar');
            var splash=document.getElementById('app-splash');
            if(p>=100){
              p=100;
              clearInterval(iv);
              if(el)el.style.width='100%';
              if(splash){
                setTimeout(function(){
                  splash.style.opacity='0';
                  setTimeout(function(){ if(splash.parentNode) splash.parentNode.removeChild(splash); }, 500);
                }, 250);
              }
            } else {
              if(el)el.style.width=p+'%';
            }
          }, 90);
        </script>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- Fallback for browsers without JavaScript -->
    <noscript>
      <style>
        #root { display: none; }
        .nojs-message {
          display: block;
          text-align: center;
          padding: 2rem;
          font-family: sans-serif;
        }
      </style>
      <div class="nojs-message">
        <h1>JavaScript is required to run this application</h1>
        <p>Please enable JavaScript in your browser settings to continue.</p>
      </div>
    </noscript>
  </body>
</html>
